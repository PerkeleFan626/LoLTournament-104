<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus Clash — League of Legends Tournament Hub</title>
  <meta name="description" content="Mobile-first esports platform for creating teams and competing in League of Legends tournaments.">
  <meta name="theme-color" content="#060e18">

  <!-- Modular Component Stylesheets -->
  <link rel="stylesheet" href="globals/globals.css">
  <link rel="stylesheet" href="Header/Header.css">
  <link rel="stylesheet" href="fotter/fotter.css">
  <link rel="stylesheet" href="TournamentPage/TournamentPage.css">
</head>
<body>

  <!-- App Viewport Wrapper -->
  <div class="app-viewport-wrapper" id="viewport-wrapper">
    
    <!-- Mobile Device Shell -->
    <main class="mobile-device-shell" id="app-container" role="main">
      
      <!-- 1. HEADER MODULE (Loaded from Header/Header.js & Header/Header.html) -->
      <div id="header-slot"></div>

      <!-- 2. TOURNAMENT PAGE CONTENT (Loaded from TournamentPage/TournamentPage.html) -->
      <div class="app-content-scroll" id="content-container">
        
        <section class="tab-view active" id="view-tournaments" aria-labelledby="tab-tournaments-label">
          
          <!-- Tournament Actions Bar -->
          <div class="section-title-row">
            <div>
              <h1 class="section-title">🏆 Tournaments</h1>
              <p class="section-subtitle">Run brackets, draft comps & compete for prizes</p>
            </div>
            <button class="btn btn-gold btn-sm" id="btn-open-create-tourney">
              <span>+ Create Cup</span>
            </button>
          </div>

          <!-- Filter Pills -->
          <div class="filter-pills-row" id="tourney-filter-row">
            <button class="filter-pill active" data-tourney-filter="all">All Tourneys</button>
            <button class="filter-pill" data-tourney-filter="live">🔴 Live & Active</button>
            <button class="filter-pill" data-tourney-filter="registration">Open Signups</button>
            <button class="filter-pill" data-tourney-filter="my">My Team's Cups</button>
          </div>

          <!-- Dynamic Tournament Card Feed Container -->
          <div id="tournament-list-container">
            <!-- Rendered dynamically by TournamentPage/TournamentPage.js -->
          </div>

          <!-- Create Tournament Modal Sheet -->
          <div class="modal-overlay" id="modal-create-tourney">
            <div class="modal-sheet">
              <div class="sheet-handle-bar"></div>
              <div class="sheet-header">
                <h3 class="sheet-title">🏆 Create Tournament</h3>
                <button class="sheet-close-btn" data-close-modal="modal-create-tourney" aria-label="Close Modal">&times;</button>
              </div>
              <div class="sheet-body">
                <form id="form-create-tourney">
                  <div class="form-group">
                    <label class="form-label" for="tourney-name-input">Tournament Name</label>
                    <input type="text" id="tourney-name-input" class="form-input" placeholder="e.g. Arcane Premier Clash Split 1" required>
                  </div>

                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label" for="tourney-format-select">Format</label>
                      <select id="tourney-format-select" class="form-select">
                        <option value="single_elimination">Single Elimination</option>
                        <option value="double_elimination">Double Elimination</option>
                        <option value="round_robin">Round Robin</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="tourney-teams-select">Max Teams</label>
                      <select id="tourney-teams-select" class="form-select">
                        <option value="4">4 Teams</option>
                        <option value="8" selected>8 Teams</option>
                        <option value="16">16 Teams</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label" for="tourney-match-select">Series Length</label>
                      <select id="tourney-match-select" class="form-select">
                        <option value="BO1">Best of 1</option>
                        <option value="BO3" selected>Best of 3</option>
                        <option value="BO5">Best of 5</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="tourney-rank-select">Min Rank</label>
                      <select id="tourney-rank-select" class="form-select">
                        <option value="IRON">Iron+</option>
                        <option value="GOLD">Gold+</option>
                        <option value="PLATINUM">Platinum+</option>
                        <option value="DIAMOND" selected>Diamond+</option>
                        <option value="MASTER">Master+</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="form-label" for="tourney-prize-input">Prize Pool</label>
                    <input type="text" id="tourney-prize-input" class="form-input" placeholder="e.g. $1,500 RP + Hextech Trophies" value="$1,000 RP">
                  </div>

                  <div style="margin-top: 18px; display: flex; gap: 8px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" data-close-modal="modal-create-tourney">Cancel</button>
                    <button type="submit" class="btn btn-gold" id="btn-submit-create-tourney" style="flex: 2;">Create Cup</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </section>

      </div> <!-- End app-content-scroll -->

      <!-- 3. FOOTER MODULE (Loaded from fotter/fotter.js & fotter/fotter.html) -->
      <div id="footer-slot"></div>

      <!-- Toast Notification Container -->
      <div id="toast-container" aria-live="polite"></div>

    </main>
  </div>

  <!-- Modular Component Scripts -->
  <script src="globals/globals.js"></script>
  <script src="Header/Header.js"></script>
  <script src="fotter/fotter.js"></script>
  <script src="TournamentPage/TournamentPage.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderHeader === 'function') renderHeader('header-slot');
      if (typeof renderFotter === 'function') renderFotter('footer-slot');
    });
  </script>
</body>
</html>
