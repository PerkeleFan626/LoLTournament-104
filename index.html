<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus Clash — League of Legends Tournament Hub</title>
  <meta name="description" content="Mobile-first esports platform for creating teams and competing in League of Legends tournaments.">
  <meta name="theme-color" content="#060e18">

  <!-- Modular Component Stylesheets -->
  <link rel="stylesheet" href="globals/globals.css">
  <link rel="stylesheet" href="Header/Header.css">
  <link rel="stylesheet" href="fotter/fotter.css">
  <link rel="stylesheet" href="TournamentPage/TournamentPage.css">
  <link rel="stylesheet" href="DraftPage/DraftPage.css">
</head>
<body>

  <!-- App Viewport Wrapper -->
  <div class="app-viewport-wrapper" id="viewport-wrapper">
    
    <!-- Mobile Device Shell -->
    <main class="mobile-device-shell" id="app-container" role="main">
      
      <!-- 1. HEADER MODULE (Loaded from Header/Header.js & Header/Header.html) -->
      <div id="header-slot"></div>

      <!-- 2. TOURNAMENT PAGE CONTENT (Loaded from TournamentPage/TournamentPage.html) -->
      <div class="app-content-scroll" id="content-container">
        
        <section class="tab-view active" id="view-tournaments" aria-labelledby="tab-tournaments-label">
          
          <!-- Tournament Actions Bar -->
          <div class="section-title-row">
            <div>
              <h1 class="section-title">🏆 Tournaments</h1>
              <p class="section-subtitle">Run brackets, draft comps & compete for prizes</p>
            </div>
            <button class="btn btn-gold btn-sm" id="btn-open-create-tourney">
              <span>+ Create Cup</span>
            </button>
          </div>

          <!-- Filter Pills -->
          <div class="filter-pills-row" id="tourney-filter-row">
            <button class="filter-pill active" data-tourney-filter="all">All Tourneys</button>
            <button class="filter-pill" data-tourney-filter="live">🔴 Live & Active</button>
            <button class="filter-pill" data-tourney-filter="registration">Open Signups</button>
            <button class="filter-pill" data-tourney-filter="my">My Team's Cups</button>
          </div>

          <!-- Dynamic Tournament Card Feed Container -->
          <div id="tournament-list-container">
            <!-- Rendered dynamically by TournamentPage/TournamentPage.js -->
          </div>

          <!-- Create Tournament Modal Sheet -->
          <div class="modal-overlay" id="modal-create-tourney">
            <div class="modal-sheet">
              <div class="sheet-handle-bar"></div>
              <div class="sheet-header">
                <h3 class="sheet-title">🏆 Create Tournament</h3>
                <button class="sheet-close-btn" data-close-modal="modal-create-tourney" aria-label="Close Modal">&times;</button>
              </div>
              <div class="sheet-body">
                <form id="form-create-tourney">
                  <div class="form-group">
                    <label class="form-label" for="tourney-name-input">Tournament Name</label>
                    <input type="text" id="tourney-name-input" class="form-input" placeholder="e.g. Arcane Premier Clash Split 1" required>
                  </div>

                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label" for="tourney-format-select">Format</label>
                      <select id="tourney-format-select" class="form-select">
                        <option value="single_elimination">Single Elimination</option>
                        <option value="double_elimination">Double Elimination</option>
                        <option value="round_robin">Round Robin</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="tourney-teams-select">Max Teams</label>
                      <select id="tourney-teams-select" class="form-select">
                        <option value="4">4 Teams</option>
                        <option value="8" selected>8 Teams</option>
                        <option value="16">16 Teams</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label" for="tourney-match-select">Series Length</label>
                      <select id="tourney-match-select" class="form-select">
                        <option value="BO1">Best of 1</option>
                        <option value="BO3" selected>Best of 3</option>
                        <option value="BO5">Best of 5</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="tourney-rank-select">Min Rank</label>
                      <select id="tourney-rank-select" class="form-select">
                        <option value="IRON">Iron+</option>
                        <option value="GOLD">Gold+</option>
                        <option value="PLATINUM">Platinum+</option>
                        <option value="DIAMOND" selected>Diamond+</option>
                        <option value="MASTER">Master+</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="form-label" for="tourney-prize-input">Prize Pool</label>
                    <input type="text" id="tourney-prize-input" class="form-input" placeholder="e.g. $1,500 RP + Hextech Trophies" value="$1,000 RP">
                  </div>

                  <div style="margin-top: 18px; display: flex; gap: 8px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" data-close-modal="modal-create-tourney">Cancel</button>
                    <button type="submit" class="btn btn-gold" id="btn-submit-create-tourney" style="flex: 2;">Create Cup</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </section>

        <!-- 3. DRAFT TOOL PAGE CONTENT (#view-draft) -->
        <section class="tab-view" id="view-draft" aria-labelledby="tab-draft-label">
          <div class="draft-container">
            
            <!-- Draft Header & Controls Card -->
            <div class="draft-header-card">
              <div class="draft-title-row">
                <h2 class="draft-main-title">
                  <span>⚡</span> Hextech Pro Draft
                </h2>
                <div class="draft-status-group">
                  <span class="draft-timer-badge" id="draft-timer-badge"><span>⏱️</span> <span>30s</span></span>
                  <span class="draft-phase-badge" id="draft-status-badge">LOBBY READY</span>
                </div>
              </div>

              <!-- 30-Second Turn Countdown Progress Bar -->
              <div class="draft-timer-track">
                <div class="draft-timer-fill" id="draft-timer-bar" style="width: 100%;"></div>
              </div>

              <!-- Announcer Banner -->
              <div class="draft-announcer-banner" id="draft-announcer">
                <span>⏳ Manual Start Required</span>
                <span>Click '▶️ Start Draft' to begin 30s turn timer</span>
              </div>

              <!-- Action Controls -->
              <div class="draft-action-controls">
                <button class="btn btn-gold btn-sm" id="btn-start-draft">
                  <span>▶️ Start Draft</span>
                </button>
                <button class="btn btn-secondary btn-sm" id="btn-reset-draft" title="Reset Draft">
                  <span>🔄 Reset</span>
                </button>
                <button class="btn btn-secondary btn-sm" id="btn-auto-pick" title="Auto Pick for current turn">
                  <span>🎲 Auto Pick</span>
                </button>
              </div>
            </div>

            <!-- Draft Arena: Blue Side vs Red Side -->
            <div class="draft-teams-grid">
              
              <!-- Blue Side Team -->
              <div class="draft-team-panel blue-team">
                <div class="team-header-strip">
                  <span class="team-name-tag">🔵 Arcane Blades</span>
                  <div class="draft-bans-strip">
                    <span class="bans-label">Bans</span>
                    <div class="ban-slot" id="blue-ban-0"></div>
                    <div class="ban-slot" id="blue-ban-1"></div>
                    <div class="ban-slot" id="blue-ban-2"></div>
                    <div class="ban-slot" id="blue-ban-3"></div>
                    <div class="ban-slot" id="blue-ban-4"></div>
                  </div>
                </div>

                <div class="draft-picks-list">
                  <div class="pick-slot empty" id="blue-pick-0"></div>
                  <div class="pick-slot empty" id="blue-pick-1"></div>
                  <div class="pick-slot empty" id="blue-pick-2"></div>
                  <div class="pick-slot empty" id="blue-pick-3"></div>
                  <div class="pick-slot empty" id="blue-pick-4"></div>
                </div>
              </div>

              <!-- Red Side Team -->
              <div class="draft-team-panel red-team">
                <div class="team-header-strip">
                  <span class="team-name-tag">🔴 Dragon Slayers</span>
                  <div class="draft-bans-strip">
                    <span class="bans-label">Bans</span>
                    <div class="ban-slot" id="red-ban-0"></div>
                    <div class="ban-slot" id="red-ban-1"></div>
                    <div class="ban-slot" id="red-ban-2"></div>
                    <div class="ban-slot" id="red-ban-3"></div>
                    <div class="ban-slot" id="red-ban-4"></div>
                  </div>
                </div>

                <div class="draft-picks-list">
                  <div class="pick-slot empty" id="red-pick-0"></div>
                  <div class="pick-slot empty" id="red-pick-1"></div>
                  <div class="pick-slot empty" id="red-pick-2"></div>
                  <div class="pick-slot empty" id="red-pick-3"></div>
                  <div class="pick-slot empty" id="red-pick-4"></div>
                </div>
              </div>

            </div>

            <!-- Champion Arena: Search & 6 Tabs -->
            <div class="champ-arena-card">
              <div class="champ-arena-header">
                <h3 class="champ-arena-title">👑 Champion Selection</h3>
                <span class="champ-count-pill" id="draft-champ-count">168 Champions</span>
              </div>

              <!-- Search Engine Input -->
              <div class="champ-search-container">
                <span class="champ-search-icon">🔍</span>
                <input type="text" id="draft-champ-search" class="champ-search-input" placeholder="Search champion by name (e.g. Ahri, Zed, Jinx)..." autocomplete="off">
              </div>

              <!-- 6 Role Tabs: All, Top, Djungle, Mid, ADC, Support -->
              <div class="champ-role-tabs" id="draft-role-tabs">
                <button class="role-tab-btn active" data-role="All">
                  <span>🌐</span> All
                </button>
                <button class="role-tab-btn" data-role="Top">
                  <span>🛡️</span> Top
                </button>
                <button class="role-tab-btn" data-role="Djungle">
                  <span>🌿</span> Djungle
                </button>
                <button class="role-tab-btn" data-role="Mid">
                  <span>⚡</span> Mid
                </button>
                <button class="role-tab-btn" data-role="ADC">
                  <span>🏹</span> ADC
                </button>
                <button class="role-tab-btn" data-role="Support">
                  <span>💖</span> Support
                </button>
              </div>

              <!-- Champion Grid Container -->
              <div class="champ-grid-scroll">
                <div class="champ-grid" id="draft-champ-grid">
                  <!-- Rendered dynamically by DraftPage.js -->
                </div>
              </div>

            </div>

          </div>
        </section>

      </div> <!-- End app-content-scroll -->

      <!-- 4. FOOTER MODULE (Loaded from fotter/fotter.js & fotter/fotter.html) -->
      <div id="footer-slot"></div>

      <!-- Toast Notification Container -->
      <div id="toast-container" aria-live="polite"></div>

    </main>
  </div>

  <!-- Modular Component Scripts -->
  <script src="globals/globals.js"></script>
  <script src="Header/Header.js"></script>
  <script src="fotter/fotter.js"></script>
  <script src="TournamentPage/TournamentPage.js"></script>
  <script src="DraftPage/draftState.js"></script>
  <script src="DraftPage/draftTimer.js"></script>
  <script src="DraftPage/draftEngine.js"></script>
  <script src="DraftPage/draftUI.js"></script>
  <script src="DraftPage/DraftPage.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderHeader === 'function') renderHeader('header-slot');
      if (typeof renderFotter === 'function') renderFotter('footer-slot');
    });
  </script>
</body>
</html>
